[package]
name = "horizon-hnmod-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone validation and compatibility planner for Horizon native mods"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

