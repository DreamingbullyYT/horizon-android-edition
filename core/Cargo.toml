[package]
name = "horizon-android-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "horizon_core"
crate-type = ["cdylib"]

[features]
default = []
audio = ["horizon-android-installer/audio"]

[dependencies]
horizon-launcher = { path = "../horizon/launcher" }
horizon-telemetry = { path = "../horizon/crates/horizon-telemetry" }
horizon-android-installer = { path = "../horizon/crates/horizon-android-installer" }
horizon-mods = { path = "../horizon/crates/horizon-mods" }
horizon-shader-api = { path = "../horizon/crates/horizon-shader-api" }
horizon-shaders = { path = "../horizon/crates/horizon-shaders" }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
android_logger = "0.14"

[profile.release]
lto = "thin"
strip = true
