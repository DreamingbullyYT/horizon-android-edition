name: HNMod core tests

on:
  push:
    branches: [feature/hnmod-core]
    paths:
      - "hnmod-core/**"
      - "android/termux/**"
      - ".github/workflows/hnmod-core.yml"
  pull_request:
    paths:
      - "hnmod-core/**"
      - ".github/workflows/hnmod-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests and compile CLI
        run: cargo test --locked --manifest-path hnmod-core/Cargo.toml --all-targets
      - name: Check Termux compiler shell syntax
        run: bash -n android/termux/build-with-mods.sh
      - name: Verify Git fetch self-repair for pinned revisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("android/termux/build-with-mods.sh").read_text()
          assert "git_fetch_revision()" in script
          assert 'git -C "$repo" config core.commitGraph false' in script
          assert 'rm -f "$repo/.git/objects/info/commit-graph"' in script
          assert 'rm -rf "$repo/.git/objects/info/commit-graphs"' in script
          assert "fetch -q --refetch --filter=blob:none origin" in script
          assert "pack.threads=1" in script
          assert "index.threads=1" in script
          assert "restore_github_snapshot()" in script
          assert 'restore_github_snapshot "$SRC" "$PIN" "horizon-rust/horizon"' in script
          assert 'restore_github_snapshot "$SRC" "$BEST_PIN" "horizon-rust/horizon"' in script
          assert 'git clone -q --filter=blob:none --no-checkout' in script
          assert 'git -C "$SRC" reset --hard' not in script
          assert 'git -C "$SRC" checkout' not in script
          assert 'git_fetch_revision "$SRC" "$PIN"' in script
          assert 'git_fetch_revision "$SRC" "$candidate"' in script
          assert 'git_fetch_revision "$MIXIN_REPO" "$candidate"' in script
          asset = Path("app/src/main/assets/hnmod/android/termux/build-with-mods.sh").read_text()
          assert asset == script, "embedded compiler script must match its source"
          PY
      - name: Verify pinned mixins build uses a local checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("android/termux/build-with-mods.sh").read_text()
          assert 'MIXIN_SOURCE="$WORK/mixins-src"' in script
          assert 'git_fetch_revision "$MIXIN_SOURCE" "$REV"' in script
          assert 'restore_github_snapshot "$MIXIN_SOURCE" "$REV" "horizon-rust/horizon-mixins"' in script
          assert 'git -C "$MIXIN_SOURCE" checkout' not in script
          assert 'cargo install --locked --path "$MIXIN_SOURCE/crates/horizon-mixins-cli" --root "$TOOL"' in script
          assert 'cargo install --locked --git https://github.com/horizon-rust/horizon-mixins' not in script
          asset = Path("app/src/main/assets/hnmod/android/termux/build-with-mods.sh").read_text()
          assert asset == script, "embedded compiler script must match its source"
          PY
      - name: Verify HNMod data is imported before post-build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("android/termux/build-with-mods.sh").read_text()
          copy = script.index('rsync -a "$STAGE/native-data/" "$OUT/native-data/"')
          post = script.index("# ---- 6. PC-compatible post-build programs")
          assert copy < post, "bundle data must be copied into the game version before post-build"
          assert 'HORIZON_NATIVE_DATA_DIR' in script
          assert 'HORIZON_NATIVE_BUNDLE_DATA_DIR' in script
          PY
      - name: Test engine compatibility metadata extraction
        shell: bash
        run: |
          hooks=$(printf '%s\n' 'pub(crate) const NATIVE_HOOKS_API: u32 = 2;' | sed -n 's/^pub(crate) const NATIVE_HOOKS_API: u32 = \([0-9]*\);.*/\1/p')
          mixins=$(printf '%s\n' 'pub const MIXINS_REV: &str = "abcdef012345";' | sed -n 's/^pub const MIXINS_REV: &str = "\([0-9a-f]*\)";.*/\1/p')
          test "$hooks" = "2"
          test "$mixins" = "abcdef012345"
