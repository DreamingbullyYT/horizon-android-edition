name: HNMod core tests

on:
  push:
    branches: [feature/hnmod-core]
    paths:
      - "hnmod-core/**"
      - "android/termux/**"
      - ".github/workflows/hnmod-core.yml"
  pull_request:
    paths:
      - "hnmod-core/**"
      - ".github/workflows/hnmod-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests and compile CLI
        run: cargo test --manifest-path hnmod-core/Cargo.toml --all-targets
      - name: Check Termux compiler shell syntax
        run: bash -n android/termux/build-with-mods.sh
      - name: Test engine compatibility metadata extraction
        shell: bash
        run: |
          hooks=$(printf '%s\n' 'pub(crate) const NATIVE_HOOKS_API: u32 = 2;' | sed -n 's/^pub(crate) const NATIVE_HOOKS_API: u32 = \([0-9]*\);.*/\1/p')
          mixins=$(printf '%s\n' 'pub const MIXINS_REV: &str = "abcdef012345";' | sed -n 's/^pub const MIXINS_REV: &str = "\([0-9a-f]*\)";.*/\1/p')
          test "$hooks" = "2"
          test "$mixins" = "abcdef012345"
