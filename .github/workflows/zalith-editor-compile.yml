name: Zalith editor compile check

on:
  push:
    branches:
      - feat/zalith-control-editor-integration
    paths:
      - "app/third_party/zalith/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/zalith-editor-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zalith-editor-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Zalith editor and supporting modules
        run: gradle :zalith:ControlEditor:compileDebugKotlin --stacktrace --no-daemon
