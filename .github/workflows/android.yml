name: Android build

# Builds the Horizon Android APK (Rust JNI core + NativeActivity game runtime + Compose launcher)
# exactly like ANDROID_BUILD.md describes, then uploads the APK as a workflow artifact.
#
#  * every push / pull request  -> debug APK artifact
#  * manual run (Actions tab)   -> choose debug or release
#  * tag like v0.2.0            -> GitHub Release with the APK attached
#
# Optional repository secrets for a signed release APK (otherwise the release build is skipped
# and only the debug-signed APK is published):
#   HORIZON_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   HORIZON_KEYSTORE_PASSWORD keystore password
#   HORIZON_KEY_ALIAS         key alias
#   HORIZON_KEY_PASSWORD      key password (defaults to the keystore password if empty)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        type: choice
        options: [debug, release, both]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "26.3.11579264"
  GRADLE_VERSION: "8.7"
  RUST_TARGET: aarch64-linux-android

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # needed to attach the APK to a GitHub Release on tags
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (stable) with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Cache Cargo registry and Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/build/rust-target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'horizon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/horizon-release.jks"
            echo "HORIZON_KEYSTORE_PATH=$RUNNER_TEMP/horizon-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured: release APK will be skipped."
          fi

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant != 'release' }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: >-
          ${{ steps.signing.outputs.available == 'true' &&
              (startsWith(github.ref, 'refs/tags/v') ||
               (github.event_name == 'workflow_dispatch' && inputs.variant != 'debug')) }}
        env:
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.HORIZON_KEYSTORE_PASSWORD }}
          HORIZON_KEY_ALIAS: ${{ secrets.HORIZON_KEY_ALIAS }}
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Horizon-Android-debug-${SHORT_SHA}.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Horizon-Android-release-${SHORT_SHA}.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
