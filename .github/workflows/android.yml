name: Android build

# Builds the Horizon Android APK (Rust JNI core + NativeActivity game runtime + Compose launcher)
# exactly like ANDROID_BUILD.md describes, then uploads the APK as a workflow artifact.
#
#  * every push / pull request  -> debug APK artifact
#  * manual run (Actions tab)   -> choose debug or release
#  * tag like v0.2.0            -> GitHub Release with the APK attached
#
# Optional repository secrets for a signed release APK (otherwise the release build is skipped
# and only the debug-signed APK is published):
#   HORIZON_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   HORIZON_KEYSTORE_PASSWORD keystore password
#   HORIZON_KEY_ALIAS         key alias
#   HORIZON_KEY_PASSWORD      key password (defaults to the keystore password if empty)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "**.txt"
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which APK to build"
        type: choice
        options: [debug, release, both]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "26.3.11579264"
  GRADLE_VERSION: "8.7"
  RUST_TARGET: aarch64-linux-android

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HORIZON_MSA_CLIENT_ID: ${{ secrets.HORIZON_MSA_CLIENT_ID }}
    permissions:
      contents: write   # needed to attach the APK to a GitHub Release on tags
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # horizon/ is the ORIGINAL horizon-rust/horizon (commit pinned in android/UPSTREAM_PIN) plus
      # our Android changes (android/android.patch): see android/README.md.
      - name: Sync upstream Horizon
        run: bash android/sync.sh

      - name: Verify embedded compiler boundary
        run: |
          ! grep -q 'com.termux.permission.RUN_COMMAND' app/src/main/AndroidManifest.xml
          ! grep -q 'com.termux' app/src/main/AndroidManifest.xml
          grep -q 'EmbeddedTermuxPaths' app/src/main/java/dev/horizon/launcher/data/EmbeddedToolchain.kt
          grep -q 'supportedAbi' app/src/main/java/dev/horizon/launcher/data/EmbeddedToolchain.kt
          test -f app/src/main/java/dev/horizon/launcher/data/EmbeddedBootstrapInstaller.kt
          test -f app/src/main/java/dev/horizon/launcher/data/EmbeddedProcessRunner.kt
          test -f app/src/main/java/dev/horizon/launcher/data/HnmodBuildAdapter.kt
          diff -qr android/overlay app/src/main/assets/hnmod/android/overlay
          cmp -s android/termux/build-with-mods.sh app/src/main/assets/hnmod/android/termux/build-with-mods.sh
          cmp -s hnmod-core/src/lib.rs app/src/main/assets/hnmod/hnmod-core/src/lib.rs
          grep -q 'HnmodBuildAdapter.compile' app/src/main/java/dev/horizon/launcher/data/EmbeddedToolchain.kt
          grep -q 'SYMLINKS.txt' app/src/main/java/dev/horizon/launcher/data/EmbeddedBootstrapInstaller.kt
          grep -q 'TERMUX_IS_TERMUX' app/src/main/java/dev/horizon/launcher/data/EmbeddedProcessRunner.kt
          grep -q 'HORIZON_EMBEDDED' app/src/main/java/dev/horizon/launcher/data/EmbeddedProcessRunner.kt
          grep -q 'BOOTSTRAP_SHA256' app/src/main/java/dev/horizon/launcher/data/EmbeddedToolchain.kt
          grep -q 'GUEST_PREFIX' app/src/main/java/dev/horizon/launcher/data/EmbeddedProcessRunner.kt
          grep -q 'libtalloc.so.2' app/src/main/java/dev/horizon/launcher/data/EmbeddedProcessRunner.kt
          grep -q 'bootstrap-aarch64.zip' app/src/main/java/dev/horizon/launcher/data/EmbeddedToolchain.kt
          test -f scripts/fetch-hnmod-runtime-assets.sh
          grep -q 'targetSdk = 28' app/build.gradle.kts

      - name: Fetch official Termux PRoot runtime assets
        run: bash scripts/fetch-hnmod-runtime-assets.sh

      - name: Verify bundled Gemini-style Termux runtime assets
        run: |
          test -s app/src/main/assets/bootstrap-aarch64.zip
          test -s app/src/main/assets/proot/proot
          test -s app/src/main/assets/proot/loader
          test -s app/src/main/assets/proot/lib/libtalloc.so.2
          test -s app/src/main/assets/proot/lib/libandroid-shmem.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (stable) with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Cache Cargo registry and Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/build/rust-target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'android/UPSTREAM_PIN') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # engine-data.zip (the generated engine tables the APK bundles) is made from Mojang's own
      # pinned files, downloaded and hash-checked by tools/android_prepare.py, exactly like
      # Vasysik/horizon-android does on a PC. Skipped when the file is committed in the repo.
      - name: Restore engine data cache
        id: enginecache
        if: ${{ hashFiles('horizon/.local/android/engine-data.zip') == '' }}
        uses: actions/cache@v4
        with:
          path: horizon/.local/android/engine-data.zip
          key: engine-data-${{ hashFiles('horizon/research-lock.json', 'horizon/crates/horizon-prepare/**', 'horizon/tools/android_prepare.py', 'horizon/tools/android_engine_data.py') }}

      - name: Generate engine data
        if: ${{ hashFiles('horizon/.local/android/engine-data.zip') == '' }}
        working-directory: horizon
        run: |
          python tools/android_prepare.py
          python tools/android_engine_data.py
          rm -rf .local/android/minecraft .local/android/jdk .local/horizon-client

      - name: Prepare signing (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/horizon-release.jks"
            echo "HORIZON_KEYSTORE_PATH=$RUNNER_TEMP/horizon-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured: release APK will be skipped."
          fi

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant != 'release' }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: >-
          ${{ steps.signing.outputs.available == 'true' &&
              (startsWith(github.ref, 'refs/tags/v') ||
               (github.event_name == 'workflow_dispatch' && inputs.variant != 'debug')) }}
        env:
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.HORIZON_KEYSTORE_PASSWORD }}
          HORIZON_KEY_ALIAS: ${{ secrets.HORIZON_KEY_ALIAS }}
          HORIZON_KEY_PASSWORD: ${{ secrets.HORIZON_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Horizon-Android-debug-${SHORT_SHA}.apk"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Horizon-Android-release-${SHORT_SHA}.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      # In-app updates, the way the PC launcher does them (docs/release-flow.md upstream): the newest
      # build is the release `nightly`, titled "Nightly <date> · <upstream commit>", with its files and a
      # signed SHA256SUMS. The previous one is kept as `nightly-<date>-<commit>` (the last few), so the app
      # can roll back. Needs the ANDROID_RELEASE_SIGNING_KEY secret (Ed25519, PKCS#8 base64).
      - name: Publish signed Nightly for in-app updates
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::ANDROID_RELEASE_SIGNING_KEY is not set, so no in-app update was published."
            exit 0
          fi
          libs=app/build/generated/jniLibs/arm64-v8a
          rm -rf nightly && mkdir nightly
          cp "$libs/libhorizon_core.so" "$libs/libhorizon_android_game.so" nightly/
          cp horizon/.local/android/engine-data.zip nightly/engine-data.zip
          # The whole app, for "Install app update": the release APK when signed with your key, else the debug one.
          apk=$(ls dist/Horizon-Android-release-*.apk 2>/dev/null | head -1 || true)
          [ -n "$apk" ] || apk=$(ls dist/Horizon-Android-debug-*.apk | head -1)
          cp "$apk" nightly/Horizon-Android.apk
          upstream=$(tr -d '[:space:]' < android/.upstream-built)
          short=${upstream::7}
          day=$(date -u +%F)
          version="nightly-$day-$short"
          cat > nightly/android-manifest.json <<JSON
          {
            "abi_level": $(cat android/ABI_LEVEL),
            "build": ${GITHUB_RUN_NUMBER},
            "version": "$version",
            "upstream": "$upstream",
            "arm64-v8a": { "core": "libhorizon_core.so", "game": "libhorizon_android_game.so", "data": "engine-data.zip" },
            "apk": "Horizon-Android.apk"
          }
          JSON
          # SHA256SUMS + SHA256SUMS.sig, signed for the "nightly" channel exactly like Horizon's own.
          bash horizon/tools/ci/sign_release.sh nightly nightly/*
          # Check it the way the app will, before anything is published.
          (cd horizon && cargo run -q -p horizon-release-sign -- verify --tag nightly \
            --key "$(grep -v '^#' ../android/release-keys.txt | tr -d '\n')" ../nightly)
          # Keep the one being replaced as nightly-<date>-<commit>.
          repo="${GITHUB_REPOSITORY}"
          if old=$(gh api "repos/$repo/releases/tags/nightly" 2>/dev/null); then
            id=$(echo "$old" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            title=$(echo "$old" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            oldtag=$(python3 - "$title" <<'PY'
          import re, sys
          m = re.match(r"Nightly (\d{4}-\d{2}-\d{2}) · ([0-9a-f]+)", sys.argv[1])
          print(f"nightly-{m.group(1)}-{m.group(2)}" if m else "")
          PY
          )
            if [ -n "$oldtag" ] && gh api "repos/$repo/releases/tags/$oldtag" >/dev/null 2>&1; then
              oldtag=""   # that archive name is taken already (same day and commit): just replace nightly
            fi
            if [ -n "$oldtag" ]; then
              gh api -X PATCH "repos/$repo/releases/$id" -f tag_name="$oldtag" -f target_commitish="${GITHUB_SHA}" >/dev/null
              git push origin ":refs/tags/nightly" || true
            else
              gh release delete nightly --cleanup-tag -y || true
            fi
          fi
          gh release create nightly nightly/* --target "${GITHUB_SHA}" --prerelease \
            --title "Nightly $day · $short" \
            --notes "Android build of Horizon upstream ${upstream}. The app installs it as ${version}."
          # Only the newest few past nightlies stay.
          gh release list --limit 100 --json tagName,createdAt -q '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag -y || true; done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
